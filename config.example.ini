; MEGA FLASH - config.ini  (скопируйте этот файл в config.ini и впишите свои значения)
; Формат: KEY=VALUE  -  БЕЗ пробелов вокруг "=", без комментариев в конце строки.
; Строки с ; или # - комментарии.

; ---------------- Telegram ----------------
; 0 = никогда не слать уведомления
NOTIFY_ENABLED=1
BOT_TOKEN=
CHAT_ID=
; Если Telegram заблокирован: ссылка на ваш Google Apps Script (/exec)
;TG_PROXY_URL=
; Или обычный прокси, например http://127.0.0.1:8080
;PROXY=
; Таймаут запросов, секунд
;HTTP_TIMEOUT=45

; ---------------- Игры ----------------
; 1 = слать в Telegram даже если всё хорошо, 0 = только при проблемах
NOTIFY_ON_OK=0
; Папка Steam, если не находится сама
;STEAM_PATH=C:\Program Files (x86)\Steam
; Аккаунт Steam для автоустановки игр
STEAM_USER=
STEAM_PASS=
; Автоматически нажимать "Установить" в окне Steam (1 = да, 0 = нет)
AUTO_CONFIRM_INSTALL=1
; Ждать установку: start = пока загрузка не началась, full = до конца, off = не ждать
WAIT_FOR_INSTALL=start
WAIT_TIMEOUT_MIN=10
; 1 = отключить Workshop для игр из списка (рекомендуется для клуба)
BLOCK_WORKSHOP=1
;RIOT_PATH=
;EPIC_PATH=
;BNET_PATH=
; Папка VK Play (где лежит GameCenter.exe), если не находится сама
;VK_PATH=
;RIOT_USER=
;RIOT_PASS=
;EPIC_USER=
;EPIC_PASS=

; ---------------- Zapret ----------------
; Куда ставить (по умолчанию C:\Zapret)
;ZAPRET_DIR=C:\Zapret
; Прямая ссылка на zip. Если пусто - берётся последний релиз с GitHub
;ZAPRET_URL=
;ZAPRET_GITHUB=Flowseal/zapret-discord-youtube
; Необязательно: SHA256 архива для проверки
;ZAPRET_SHA256=

; ---------------- Резервная копия ----------------
; Пары Имя|Путь через ;   Пути с пробелами и %ENV% можно.
ITEMS=Docs|D:\Docs;Saves|D:\Saves
; Сколько последних копий хранить для каждого пункта
KEEP_BACKUPS=5

; ---------------- Очистка ----------------
; Папки через ;   Корни дисков и системные папки блокируются автоматически.
PATHS=%TEMP%;%SystemRoot%\Temp
EMPTY_RECYCLE=1
; Очистка DISM медленная, по умолчанию выключена
DISM_CLEANUP=0
; /resetbase необратим: установленные обновления нельзя будет удалить
DISM_RESETBASE=0
